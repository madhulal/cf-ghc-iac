name: IAC Onboard Repo

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to create and configure (e.g. dev, qa, prod)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
      gh_client_write_token:
        description: 'PAT with Write/Admin access to this client repository. Leave blank to use the pre-stored GH_CLIENT_WRITE_TOKEN repository secret.'
        required: false
        type: string
      cf_api_token:
        description: 'Cloudflare API Token for this client. Leave blank to use the pre-stored CF_API_TOKEN repository secret.'
        required: false
        type: string
      gh_master_repo_access_token:
        description: 'PAT with Read access to the streakjs-common-infra repository. Leave blank to use the pre-stored GH_MASTER_REPO_ACCESS_TOKEN repository secret.'
        required: false
        type: string
      config_file:
        description: 'Path to the IAC config JSON file in this repo'
        required: false
        default: '.github/iac-config.json'
        type: string

permissions:
  contents: read

jobs:
  onboard:
    name: Provision Environment, Variables, and Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout client repo
        uses: actions/checkout@v6

      - name: Resolve and validate tokens
        # Dispatch inputs take precedence over pre-stored secrets.
        # If neither is set, the step fails with a clear message.
        env:
          INPUT_CLIENT_WRITE_TOKEN:    ${{ github.event.inputs.gh_client_write_token }}
          SECRET_CLIENT_WRITE_TOKEN:   ${{ secrets.GH_CLIENT_WRITE_TOKEN }}
          INPUT_CF_API_TOKEN:          ${{ github.event.inputs.cf_api_token }}
          SECRET_CF_API_TOKEN:         ${{ secrets.CF_API_TOKEN }}
          INPUT_MASTER_REPO_TOKEN:     ${{ github.event.inputs.gh_master_repo_access_token }}
          SECRET_MASTER_REPO_TOKEN:    ${{ secrets.GH_MASTER_REPO_ACCESS_TOKEN }}
        run: |
          resolve() {
            local name="$1" input="$2" secret="$3"
            if [[ -n "$input" ]]; then
              echo "  ✓ $name — using dispatch input"
              echo "$input"
            elif [[ -n "$secret" ]]; then
              echo "  ✓ $name — using pre-stored repository secret" >&2
              echo "$secret"
            else
              echo "❌ $name is required: provide it as a dispatch input or pre-store it as a repository secret" >&2
              exit 1
            fi
          }

          CLIENT_WRITE_TOKEN=$(resolve "gh_client_write_token" "$INPUT_CLIENT_WRITE_TOKEN" "$SECRET_CLIENT_WRITE_TOKEN")
          CF_API_TOKEN=$(resolve "cf_api_token"               "$INPUT_CF_API_TOKEN"       "$SECRET_CF_API_TOKEN")
          MASTER_REPO_TOKEN=$(resolve "gh_master_repo_access_token" "$INPUT_MASTER_REPO_TOKEN" "$SECRET_MASTER_REPO_TOKEN")

          echo "GH_CLIENT_WRITE_TOKEN_RESOLVED=$CLIENT_WRITE_TOKEN" >> "$GITHUB_ENV"
          echo "CF_API_TOKEN_RESOLVED=$CF_API_TOKEN"                >> "$GITHUB_ENV"
          echo "GH_MASTER_REPO_TOKEN_RESOLVED=$MASTER_REPO_TOKEN"  >> "$GITHUB_ENV"

      - name: Read IAC config file
        id: config
        env:
          ENV_NAME: ${{ github.event.inputs.environment }}
          CONFIG_FILE: ${{ github.event.inputs.config_file }}
        run: |
          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "❌ Config file not found: $CONFIG_FILE"
            exit 1
          fi

          echo "📄 Reading config from $CONFIG_FILE for environment: $ENV_NAME"

          if ! jq empty "$CONFIG_FILE" 2>/dev/null; then
            echo "❌ Config file is not valid JSON: $CONFIG_FILE"
            exit 1
          fi

          # Validate the selected environment exists
          if ! jq -e --arg env "$ENV_NAME" '.environments[$env]' "$CONFIG_FILE" > /dev/null; then
            echo "❌ Environment '$ENV_NAME' not found in $CONFIG_FILE"
            echo "   Available environments: $(jq -r '.environments | keys | join(", ")' "$CONFIG_FILE")"
            exit 1
          fi

          # Merge: shared top-level fields (excluding 'environments') are overridden by env-specific fields
          CFG=$(jq -c --arg env "$ENV_NAME" \
            'del(._comment, .environments) * (.environments[$env])' \
            "$CONFIG_FILE")

          # Required fields
          PROJECT_NAME=$(echo "$CFG" | jq -r '.project_name // empty')
          CF_ACCOUNT_ID=$(echo "$CFG" | jq -r '.cf_account_id // empty')

          if [[ -z "$PROJECT_NAME" ]]; then
            echo "❌ Missing required field: project_name (set at top level or under environments.$ENV_NAME)"
            exit 1
          fi

          if [[ -z "$CF_ACCOUNT_ID" ]]; then
            echo "❌ Missing required field: cf_account_id (set at top level or under environments.$ENV_NAME)"
            exit 1
          fi

          # Optional fields
          CF_WORKER_NAME=$(echo "$CFG"              | jq -r '.cf_worker_name // ""')
          CF_R2_BUCKET_NAME=$(echo "$CFG"           | jq -r '.cf_r2_bucket_name // ""')
          CF_WORKER_COMPATIBILITY_DATE=$(echo "$CFG" | jq -r '.cf_worker_compatibility_date // ""')
          CF_PAGES_WEB_CMS_NAME=$(echo "$CFG"       | jq -r '.cf_pages_name // ""')
          CF_WORKER_CUSTOM_DOMAINS=$(echo "$CFG"    | jq -c '.cf_worker_custom_domains // []')
          CF_PAGES_CUSTOM_DOMAINS=$(echo "$CFG"     | jq -r 'if .cf_pages_custom_domain then (.cf_pages_custom_domain | tojson) else "" end')
          CF_PAGES_PROD_BRANCH=$(echo "$CFG"        | jq -r '.cf_pages_prod_branch // ""')
          CF_R2_BUCKET_LOCATION=$(echo "$CFG"       | jq -r '.cf_r2_bucket_location // "APAC"')
          CF_MANAGE_ZONE_RESOURCES=$(echo "$CFG"    | jq -r '.cf_manage_zone_resources // "true"')
          CF_SECURITY_CONTACT=$(echo "$CFG"         | jq -r '.cf_security_contact // ""')
          CF_DMARC_POLICY=$(echo "$CFG"             | jq -r '.cf_dmarc_policy // ""')
          CF_DMARC_RUA=$(echo "$CFG"                | jq -r '.cf_dmarc_rua // ""')

          {
            echo "PROJECT_NAME=$PROJECT_NAME"
            echo "CF_ACCOUNT_ID=$CF_ACCOUNT_ID"
            echo "CF_WORKER_NAME=$CF_WORKER_NAME"
            echo "CF_R2_BUCKET_NAME=$CF_R2_BUCKET_NAME"
            echo "CF_WORKER_COMPATIBILITY_DATE=$CF_WORKER_COMPATIBILITY_DATE"
            echo "CF_PAGES_WEB_CMS_NAME=$CF_PAGES_WEB_CMS_NAME"
            echo "CF_WORKER_CUSTOM_DOMAINS=$CF_WORKER_CUSTOM_DOMAINS"
            echo "CF_PAGES_CUSTOM_DOMAINS=$CF_PAGES_CUSTOM_DOMAINS"
            echo "CF_PAGES_PROD_BRANCH=$CF_PAGES_PROD_BRANCH"
            echo "CF_R2_BUCKET_LOCATION=$CF_R2_BUCKET_LOCATION"
            echo "CF_MANAGE_ZONE_RESOURCES=$CF_MANAGE_ZONE_RESOURCES"
            echo "CF_SECURITY_CONTACT=$CF_SECURITY_CONTACT"
            echo "CF_DMARC_POLICY=$CF_DMARC_POLICY"
            echo "CF_DMARC_RUA=$CF_DMARC_RUA"
          } >> "$GITHUB_ENV"

          echo "✅ Config loaded: project=$PROJECT_NAME env=$ENV_NAME"

      - name: Checkout IaC repo
        uses: actions/checkout@v6
        with:
          repository: valoriz/streakjs-common-infra
          ref: main
          token: ${{ env.GH_MASTER_REPO_TOKEN_RESOLVED }}
          path: infra

      - name: Run onboarding script
        env:
          GH_TOKEN: ${{ env.GH_CLIENT_WRITE_TOKEN_RESOLVED }}
          REPO: ${{ github.repository }}
          ENV_NAME: ${{ github.event.inputs.environment }}
          CF_API_TOKEN: ${{ env.CF_API_TOKEN_RESOLVED }}
          GH_MASTER_REPO_ACCESS_TOKEN: ${{ env.GH_MASTER_REPO_TOKEN_RESOLVED }}
          # All remaining vars are populated from the config file via GITHUB_ENV
        run: |
          chmod +x infra/iac/cloudflare/scripts/onboard-client.sh
          infra/iac/cloudflare/scripts/onboard-client.sh
